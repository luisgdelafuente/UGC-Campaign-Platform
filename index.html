<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UGC Campaign Platform</title>
    <meta
      name="description"
      content="Creator-led UGC campaigns for brands: briefing, casting, production and paid-ready assets in one platform." />
    <meta name="theme-color" content="#0C0C0E" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FBFAF8" media="(prefers-color-scheme: light)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="UGC Campaign Platform" />
    <meta
      property="og:description"
      content="Creator-led UGC campaigns for brands: briefing, casting, production and paid-ready assets in one platform." />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the stored theme before first paint. Without this the page
      // paints the light palette for a frame on every refresh/deep link
      // and then flips to dark once React mounts.
      (function () {
        try {
          var stored = window.localStorage.getItem('ugc-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
          var lang = window.localStorage.getItem('ugc-lang');
          if (lang === 'en' || lang === 'es') document.documentElement.lang = lang;
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
